services:
  tbo:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TBO_PORT: "8000"
      # Вход по паролю: раскомментируйте и задайте свой пароль
      # TBO_AUTH_USER: "admin"
      # TBO_AUTH_PASSWORD: "смените-пароль"
    volumes:
      - tbo-data:/srv/data
volumes:
  tbo-data:
