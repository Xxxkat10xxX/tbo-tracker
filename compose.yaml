# tbo-tracker — Docker Compose (подробно: docs/DEPLOY.md)
#
#   SQLite (по умолчанию):          docker compose up -d --build
#   PostgreSQL:                     docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
#   + HTTPS (Caddy, Let's Encrypt): docker compose -f compose.yaml -f compose.postgres.yaml -f compose.https.yaml up -d --build
#
# Паролей в этих файлах нет: пароль БД — Docker secret (secrets/db_password.txt),
# администратор создаётся одноразовым кодом настройки из журнала: docker compose logs app | grep -A1 "код настройки"
name: tbo-tracker

services:
  app:
    build: .
    image: tbo-tracker:${TBO_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TBO_DATA_DIR: /data
      TBO_HOST: 0.0.0.0
      TBO_PORT: "8000"
    ports:
      # 127.0.0.1 — только с этого сервера (за HTTPS-прокси); для доступа из локальной сети задайте TBO_BIND=0.0.0.0 в .env
      - "${TBO_BIND:-127.0.0.1}:${TBO_HTTP_PORT:-8000}:8000"
    volumes:
      - tbo-data:/data              # база SQLite, фото, резервные копии, настройки сервера
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [tbo]

volumes:
  tbo-data:

networks:
  tbo:
    ipam:
      config:
        - subnet: ${TBO_SUBNET:-172.31.250.0/24}
